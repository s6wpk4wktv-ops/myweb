<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>스네이크 게임</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121922;
    --line: #1f2a37;
    --green: #39ff88;
    --green-dark: #1fb860;
    --red: #ff4d6d;
    --text: #d8e6f0;
    --muted: #7d8da0;
    --board: min(94vw, calc(100dvh - 330px), 560px);
    --btn: clamp(56px, 18vw, 78px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #14202d 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
  }
  .app {
    height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
  }
  .game { display: flex; flex-direction: column; align-items: center; gap: 10px; }

  /* 상단 점수판 */
  .hud {
    width: var(--board);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 14px;
    letter-spacing: .5px;
  }
  .hud .label { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .hud .value { font-size: clamp(20px, 5vw, 28px); font-weight: 800; color: var(--green); text-shadow: 0 0 10px rgba(57,255,136,.45); font-variant-numeric: tabular-nums; }
  .hud .title { font-weight: 800; font-size: clamp(14px, 4vw, 18px); color: var(--text); }
  .hud .col { display: flex; flex-direction: column; line-height: 1.1; }
  .hud .col.right { align-items: flex-end; }
  .hud .col.right .value { color: #ffd166; text-shadow: 0 0 10px rgba(255,209,102,.35); }

  /* 게임 보드 */
  .board-wrap {
    position: relative;
    width: var(--board); height: var(--board);
    border-radius: 12px;
    border: 2px solid var(--green-dark);
    box-shadow: 0 0 24px rgba(57,255,136,.25), inset 0 0 20px rgba(0,0,0,.6);
    overflow: hidden;
    background: #070b10;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; text-align: center;
    background: rgba(5, 8, 12, .72);
    backdrop-filter: blur(2px);
    padding: 16px;
    transition: opacity .15s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { margin: 0; font-size: clamp(22px, 7vw, 34px); color: var(--green); text-shadow: 0 0 14px rgba(57,255,136,.6); }
  .overlay.over h2 { color: var(--red); text-shadow: 0 0 14px rgba(255,77,109,.6); }
  .overlay p { margin: 0; color: var(--muted); font-size: clamp(12px, 3.5vw, 15px); line-height: 1.5; }

  /* 제어 버튼 */
  .actions { display: flex; gap: 8px; width: var(--board); }
  .actions button {
    flex: 1;
    height: 44px;
    border-radius: 10px;
    border: 1px solid var(--green-dark);
    background: #0f1a14;
    color: var(--green);
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .12s, transform .05s, opacity .12s;
  }
  .actions button:hover:not(:disabled) { background: #153021; }
  .actions button:active:not(:disabled) { transform: scale(.96); }
  .actions button:disabled { opacity: .35; cursor: not-allowed; }
  .actions button.primary { background: var(--green-dark); color: #04140a; }
  .actions button.primary:hover:not(:disabled) { background: var(--green); }

  /* 터치 방향 버튼 */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, var(--btn));
    grid-template-rows: repeat(3, var(--btn));
    gap: 6px;
  }
  .dpad button {
    border: 1px solid var(--green-dark);
    border-radius: 16px;
    background: linear-gradient(#162231, #0f1823);
    color: var(--green);
    font-size: calc(var(--btn) * .42);
    touch-action: manipulation;
    cursor: pointer;
    padding: 0;
  }
  .dpad button:active, .dpad button.pressed { background: var(--green-dark); color: #04140a; transform: scale(.94); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }

  .hint { color: var(--muted); font-size: 12px; text-align: center; }
  .hint.touch { display: none; }

  /* 터치 기기 또는 좁은 화면: 방향 버튼 표시 */
  @media (pointer: coarse), (max-width: 820px) {
    .dpad { display: grid; }
    .hint.kbd { display: none; }
    .hint.touch { display: block; }
  }
  /* PC 키보드 환경에서는 높이를 덜 차지 */
  @media (pointer: fine) and (min-width: 821px) {
    :root { --board: min(94vw, calc(100dvh - 210px), 560px); }
  }
  /* 가로 방향 스마트폰/태블릿: 좌우 배치 */
  @media (orientation: landscape) and (max-height: 600px) {
    :root { --board: min(calc(100dvh - 130px), 60vw); --btn: clamp(48px, 15dvh, 70px); }
    .app { flex-direction: row; gap: 20px; }
    .side { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .hint { display: none !important; }
  }
  @media (orientation: portrait), (min-height: 601px) {
    .side { display: contents; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="game">
    <div class="hud" aria-live="polite">
      <div class="col"><span class="label">점수</span><span class="value" id="score">0</span></div>
      <div class="title">🐍 SNAKE</div>
      <div class="col right"><span class="label">최고 점수</span><span class="value" id="best">0</span></div>
    </div>

    <div class="board-wrap" id="boardWrap">
      <canvas id="canvas" aria-label="스네이크 게임 화면"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">SNAKE</h2>
        <p id="ovText">‘시작’ 버튼을 눌러 게임을 시작하세요.</p>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="actions">
      <button id="btnStart" class="primary">시작</button>
      <button id="btnPause" disabled>일시정지</button>
      <button id="btnRestart">다시 시작</button>
    </div>

    <div class="dpad" id="dpad">
      <button class="up" data-dir="up" aria-label="위">▲</button>
      <button class="left" data-dir="left" aria-label="왼쪽">◀</button>
      <button class="right" data-dir="right" aria-label="오른쪽">▶</button>
      <button class="down" data-dir="down" aria-label="아래">▼</button>
    </div>

    <div class="hint kbd">방향키(또는 WASD)로 이동 · 스페이스바: 시작/일시정지</div>
    <div class="hint touch">방향 버튼을 누르거나 게임 화면을 스와이프하세요</div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ===== 설정 =====
  const COLS = 20, ROWS = 20;
  const TICK_MS = 130;          // 일정한 이동 속도 (작을수록 빠름)
  const MAX_QUEUE = 3;          // 방향 입력 버퍼 크기
  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1 },
    left:  { x: -1, y: 0 },
    right: { x: 1,  y: 0 }
  };

  // ===== 요소 =====
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const btnStart = document.getElementById('btnStart');
  const btnPause = document.getElementById('btnPause');
  const btnRestart = document.getElementById('btnRestart');
  const wrap = document.getElementById('boardWrap');

  // ===== 상태 =====
  let snake, dir, dirQueue, food, score, best = 0;
  let state = 'idle';           // idle | running | paused | over
  let lastTime = 0, acc = 0;
  let size = 400, cell = 20;

  try { best = parseInt(localStorage.getItem('snake-best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  // ===== 초기화 =====
  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = DIRS.right;
    dirQueue = [];
    score = 0;
    acc = 0;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!occupied.has(x + ',' + y)) free.push({ x, y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  // ===== 상태 전환 =====
  function startGame() {
    if (state !== 'idle') return;
    state = 'running';
    lastTime = performance.now();
    acc = 0;
    updateUI();
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
    } else if (state === 'paused') {
      state = 'running';
      lastTime = performance.now();
      acc = 0;
    } else return;
    updateUI();
  }

  function restartGame() {
    reset();
    state = 'running';
    lastTime = performance.now();
    updateUI();
  }

  function gameOver(win) {
    state = 'over';
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('snake-best', String(best)); } catch (e) {}
    }
    updateUI(win);
  }

  function updateUI(win) {
    btnStart.disabled = state !== 'idle';
    btnPause.disabled = !(state === 'running' || state === 'paused');
    btnPause.textContent = state === 'paused' ? '계속하기' : '일시정지';

    overlay.classList.toggle('hidden', state === 'running');
    overlay.classList.toggle('over', state === 'over' && !win);

    if (state === 'idle') {
      ovTitle.textContent = 'SNAKE';
      ovText.innerHTML = '‘시작’ 버튼을 눌러<br>게임을 시작하세요.';
    } else if (state === 'paused') {
      ovTitle.textContent = '일시정지';
      ovText.innerHTML = '‘계속하기’ 또는 스페이스바로<br>이어서 플레이하세요.';
    } else if (state === 'over') {
      ovTitle.textContent = win ? '🎉 클리어!' : 'GAME OVER';
      ovText.innerHTML = '최종 점수: <b style="color:#39ff88">' + score + '</b><br>‘다시 시작’ 버튼으로 재도전!';
    }
  }

  // ===== 입력 처리 =====
  function setDirection(name) {
    if (state !== 'running') return;
    const d = DIRS[name];
    if (!d) return;
    // 마지막으로 예약된(또는 현재) 방향 기준으로 검사 → 즉시 반대 방향/중복 입력 무시
    const ref = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (d.x === -ref.x && d.y === -ref.y) return;
    if (d.x === ref.x && d.y === ref.y) return;
    if (dirQueue.length < MAX_QUEUE) dirQueue.push(d);
  }

  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', W: 'up', s: 'down', S: 'down', a: 'left', A: 'left', d: 'right', D: 'right'
  };

  window.addEventListener('keydown', (e) => {
    if (KEYMAP[e.key]) {
      e.preventDefault();
      if (!e.repeat) setDirection(KEYMAP[e.key]);
      return;
    }
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'idle') startGame();
      else if (state === 'over') restartGame();
      else togglePause();
    } else if (e.key === 'p' || e.key === 'P') {
      togglePause();
    }
  }, { passive: false });

  // 터치 방향 버튼 (pointerdown으로 즉각 반응)
  document.querySelectorAll('.dpad button').forEach(btn => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      setDirection(btn.dataset.dir);
      btn.classList.add('pressed');
    });
    const release = () => btn.classList.remove('pressed');
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  // 캔버스 스와이프
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 'right' : 'left');
    else setDirection(dy > 0 ? 'down' : 'up');
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', () => { touchStart = null; }, { passive: true });

  // 제어 버튼
  [btnStart, btnPause, btnRestart].forEach(b => b.addEventListener('click', () => b.blur()));
  btnStart.addEventListener('click', startGame);
  btnPause.addEventListener('click', togglePause);
  btnRestart.addEventListener('click', restartGame);

  // 탭 전환/앱 이탈 시 자동 일시정지
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'running') togglePause();
  });

  // 확대/더블탭 방지 (iOS)
  document.addEventListener('gesturestart', e => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd < 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // ===== 게임 로직 =====
  function step() {
    if (dirQueue.length) dir = dirQueue.shift();

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 벽 충돌
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver(false);
      return;
    }

    const eat = food && head.x === food.x && head.y === food.y;
    // 먹이를 먹지 않으면 꼬리가 비켜나므로 꼬리 칸은 충돌 대상에서 제외
    const body = eat ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) {
      gameOver(false);
      return;
    }

    snake.unshift(head);
    if (eat) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      if (!food) { gameOver(true); return; }   // 판을 모두 채우면 클리어
    } else {
      snake.pop();
    }
  }

  function loop(now) {
    const dt = Math.min(now - lastTime, 250);
    lastTime = now;
    if (state === 'running') {
      acc += dt;
      while (acc >= TICK_MS && state === 'running') {
        step();
        acc -= TICK_MS;
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ===== 렌더링 =====
  function resize() {
    const rect = wrap.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    size = Math.max(100, Math.floor(rect.width));
    canvas.width = Math.floor(size * dpr);
    canvas.height = Math.floor(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / COLS;
    draw();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    // 배경
    ctx.fillStyle = '#070b10';
    ctx.fillRect(0, 0, size, size);

    // 격자
    ctx.strokeStyle = 'rgba(80, 120, 150, 0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      const p = Math.round(i * cell) + 0.5;
      ctx.moveTo(p, 0); ctx.lineTo(p, size);
      ctx.moveTo(0, p); ctx.lineTo(size, p);
    }
    ctx.stroke();

    // 먹이
    if (food) {
      const cx = (food.x + 0.5) * cell, cy = (food.y + 0.5) * cell;
      const pulse = 1 + Math.sin(performance.now() / 200) * 0.06;
      ctx.save();
      ctx.shadowColor = '#ff4d6d';
      ctx.shadowBlur = cell * 0.7;
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.arc(cx, cy, cell * 0.33 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath();
      ctx.arc(cx - cell * 0.1, cy - cell * 0.1, cell * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }

    // 뱀
    if (!snake) return;
    const pad = cell * 0.07;
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = snake.length > 1 ? i / (snake.length - 1) : 0;
      const g = Math.round(255 - t * 85);        // 머리→꼬리 약간 어두워지는 초록
      ctx.save();
      if (i === 0) { ctx.shadowColor = '#39ff88'; ctx.shadowBlur = cell * 0.6; }
      ctx.fillStyle = i === 0 ? '#5dffa0' : `rgb(${Math.round(20 + (1 - t) * 20)}, ${g}, ${Math.round(80 + (1 - t) * 20)})`;
      roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.28);
      ctx.fill();
      ctx.restore();
    }

    // 눈
    const h = snake[0];
    const hx = (h.x + 0.5) * cell, hy = (h.y + 0.5) * cell;
    const fx = dir.x, fy = dir.y;               // 진행 방향
    const px = -fy, py = fx;                     // 수직 방향
    const eyeOff = cell * 0.2, eyeFwd = cell * 0.14;
    ctx.fillStyle = '#04140a';
    for (const sgn of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(hx + fx * eyeFwd + px * eyeOff * sgn, hy + fy * eyeFwd + py * eyeOff * sgn, cell * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ===== 시작 =====
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  reset();
  updateUI();
  resize();
  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
